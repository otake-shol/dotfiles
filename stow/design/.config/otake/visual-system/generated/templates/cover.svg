<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">記事カバーのテンプレート</title>
  <desc id="desc">青い背景に白い記事タイトル、3つのキーワード、個人ブランドマーカーを配置したカバー。</desc>
  <rect width="1200" height="675" fill="#2C63B4"/>

  <g data-slot="eyebrow">
    <text x="169" y="89" text-anchor="middle" fill="#FFFFFF" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16px" font-weight="700" letter-spacing="1.4">VISUAL NOTE 001</text>
  </g>

  <g>
    <text data-slot="title" x="72" y="190" fill="#FFFFFF" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="48px" font-weight="700">
      <tspan x="72" dy="0">記事の中心メッセージを</tspan>
      <tspan x="72" dy="68">短く、構造的に伝える</tspan>
    </text>
  </g>
  <text data-slot="subtitle" x="75" y="340" fill="#DCE8F6" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20px" font-weight="500">補足は一文だけ。詳しい説明は本文へ戻す。</text>

  <g>

    <text data-slot="label-1" x="142" y="478" fill="#FFFFFF" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20px" font-weight="700">構造</text>

    <text data-slot="label-2" x="434" y="478" fill="#FFFFFF" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20px" font-weight="700">判断</text>

    <text data-slot="label-3" x="726" y="478" fill="#FFFFFF" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20px" font-weight="700">実践</text>
  </g>

  <text data-slot="source" x="72" y="620" fill="#DCE8F6" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="14px">筆者作成</text>
  <g transform="translate(892 586)"><g data-slot="brand" aria-label="otake-shol visual note">
  <rect width="36" height="36" rx="9" fill="#123858"/>
