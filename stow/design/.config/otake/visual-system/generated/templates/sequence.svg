      <text data-slot="actor-1" x="230" y="257" text-anchor="middle" fill="#17202A" font-size="20px" font-weight="700">Author</text>
      <line x1="230" y1="278" x2="230" y2="548" stroke="#65717E" stroke-width="1px" stroke-dasharray="6 8"/>
    </g>
    <g>
      <rect x="490" y="220" width="220" height="58" rx="4" fill="#ECF2F9" stroke="#D5DDE6" stroke-width="1px"/>
      <text data-slot="actor-2" x="600" y="257" text-anchor="middle" fill="#17202A" font-size="20px" font-weight="700">OVS CLI</text>
      <line x1="600" y1="278" x2="600" y2="548" stroke="#65717E" stroke-width="1px" stroke-dasharray="6 8"/>
    </g>
    <g>
      <rect x="860" y="220" width="220" height="58" rx="4" fill="#ECF2F9" stroke="#D5DDE6" stroke-width="1px"/>
      <text data-slot="actor-3" x="970" y="257" text-anchor="middle" fill="#17202A" font-size="20px" font-weight="700">Media</text>
