    <rect width="286" height="300" rx="21" fill="#EFEAFF"/>
    <path d="M286 0V300" stroke="#1B2438" stroke-width="2.5px"/>
    <text x="32" y="52" fill="#744CF0" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">TERM</text>
    <text data-slot="term" x="32" y="112" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="36px" font-weight="700">OVS</text>
    <text data-slot="reading" x="34" y="152" fill="#55617A" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px">Otake Visual System</text>
    <text data-slot="definition" x="330" y="78" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="24px" font-weight="700">意図から一貫した図を生成する個人用の仕組み</text>
    <line x1="330" y1="112" x2="944" y2="112" stroke="#DDE5F0" stroke-width="2.5px"/>
    <rect x="330" y="146" width="104" height="34" rx="17" fill="#12C48B"/>
    <text x="382" y="169" text-anchor="middle" fill="#1B2438" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="14px" font-weight="700">含む</text>
    <text data-slot="includes" x="454" y="170" fill="#55617A" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px">brief・SVG・alt・検証</text>
    <rect x="330" y="210" width="104" height="34" rx="17" fill="#FF6B4A"/>
