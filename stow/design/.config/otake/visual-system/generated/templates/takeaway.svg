<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">要点カードのテンプレート</title>
  <desc id="desc">記事で最も残したい主張と次の行動を大きく示す。</desc>
  <rect width="1200" height="675" fill="#FFFBF5"/>
  <rect x="64" y="54" width="168" height="36" rx="18" fill="#12C48B"/>
  <text data-slot="eyebrow" x="148" y="79" text-anchor="middle" fill="#1B2438" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">KEY TAKEAWAY</text>
  <text data-slot="title" x="64" y="144" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="36px" font-weight="700">読者に残したい一文を、独立させる</text>
  <text data-slot="subtitle" x="66" y="183" fill="#55617A" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px">記事の要約ではなく、判断や行動につながる結論を書く。</text>

  <g transform="translate(104 238)">
    <rect x="8" y="8" width="992" height="280" rx="24" fill="#1B2438"/>
    <rect width="992" height="280" rx="24" fill="#E3F9F1" stroke="#1B2438" stroke-width="4px"/>
    <circle cx="88" cy="92" r="44" fill="#12C48B" stroke="#1B2438" stroke-width="2.5px"/>
    <path d="m66 92 15 15 29-33" fill="none" stroke="#1B2438" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text data-slot="message" x="160" y="96" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="36px" font-weight="700">良い図は、描く前のbriefで決まる</text>
    <line x1="160" y1="132" x2="914" y2="132" stroke="#1B2438" stroke-width="1.5px"/>
    <rect x="160" y="166" width="126" height="40" rx="20" fill="#1479BE"/>
    <text x="223" y="193" text-anchor="middle" fill="#FFFFFF" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="16px" font-weight="700">NEXT ACTION</text>
    <text data-slot="action" x="310" y="194" fill="#1B2438" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px" font-weight="700">messageとsourceを先に書く</text>
  </g>

  <text data-slot="source" x="64" y="620" fill="#687389" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="14px">筆者作成</text>
  <g transform="translate(892 586)"><g data-slot="brand" aria-label="otake-shol visual note">
  <rect width="36" height="36" rx="9" fill="#1B2438"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#1479BE" stroke-width="2"/>
  <g fill="#FFFFFF" aria-hidden="true">
    <rect x="8" y="12" width="4" height="12" rx="1"/>
    <rect x="13" y="12" width="4" height="12" rx="1"/>
    <rect x="18" y="12" width="4" height="12" rx="1"/>
    <rect x="23" y="12" width="4" height="12" rx="1"/>
  </g>
  <text x="48" y="16" fill="#1B2438" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">otake-shol</text>
  <text x="48" y="34" fill="#687389" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="14px">visual note</text>
</g></g>
</svg>
