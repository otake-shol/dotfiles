<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">タイムラインのテンプレート</title>
  <desc id="desc">4つの出来事を左から右へ時間順に並べる。</desc>
  <rect width="1200" height="675" fill="#FAF8F3"/>
  <rect x="64" y="54" width="142" height="36" rx="4" fill="#2C63B4"/>
  <text data-slot="eyebrow" x="135" y="79" text-anchor="middle" fill="#FFFFFF" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16px" font-weight="700">TIMELINE</text>
  <text data-slot="title" x="64" y="144" fill="#17202A" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="36px" font-weight="700">出来事と判断の変化を、時間でつなぐ</text>
  <text data-slot="subtitle" x="66" y="183" fill="#65717E" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20px">日付だけでなく、その時点で何が変わったかを書く。</text>

  <line x1="120" y1="354" x2="1080" y2="354" stroke="#17202A" stroke-width="2px"/>
  <g font-family="'Noto Sans JP', 'Yu Gothic', sans-serif">
    <g transform="translate(150 354)">
      <circle r="18" fill="#2C63B4" stroke="#17202A" stroke-width="1px"/>
      <rect x="-90" y="-116" width="180" height="82" rx="4" fill="#DCE8F6" stroke="#D5DDE6" stroke-width="1px"/>
      <text data-slot="date-1" x="0" y="-86" text-anchor="middle" fill="#123858" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16px" font-weight="700">STEP 01</text>
      <text data-slot="label-1" x="0" y="-56" text-anchor="middle" fill="#17202A" font-size="16px" font-weight="700">課題を発見</text>
      <text data-slot="body-1" x="0" y="70" text-anchor="middle" fill="#65717E" font-size="16px">ばらつきを観察</text>
    </g>
    <g transform="translate(450 354)">
      <circle r="18" fill="#DCE8F6" stroke="#17202A" stroke-width="1px"/>
      <rect x="-90" y="-116" width="180" height="82" rx="4" fill="#ECF2F9" stroke="#D5DDE6" stroke-width="1px"/>
      <text data-slot="date-2" x="0" y="-86" text-anchor="middle" fill="#17202A" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16px" font-weight="700">STEP 02</text>
      <text data-slot="label-2" x="0" y="-56" text-anchor="middle" fill="#17202A" font-size="16px" font-weight="700">原則を定義</text>
      <text data-slot="body-2" x="0" y="70" text-anchor="middle" fill="#65717E" font-size="16px">判断軸を固定</text>
    </g>
    <g transform="translate(750 354)">
      <circle r="18" fill="#2C63B4" stroke="#17202A" stroke-width="1px"/>
      <rect x="-90" y="-116" width="180" height="82" rx="4" fill="#ECF2F9" stroke="#D5DDE6" stroke-width="1px"/>
      <text data-slot="date-3" x="0" y="-86" text-anchor="middle" fill="#2C63B4" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16px" font-weight="700">STEP 03</text>
      <text data-slot="label-3" x="0" y="-56" text-anchor="middle" fill="#17202A" font-size="16px" font-weight="700">仕組みを実装</text>
      <text data-slot="body-3" x="0" y="70" text-anchor="middle" fill="#65717E" font-size="16px">自動生成へ移行</text>
    </g>
    <g transform="translate(1050 354)">
      <circle r="18" fill="#DCE8F6" stroke="#17202A" stroke-width="1px"/>
      <rect x="-90" y="-116" width="180" height="82" rx="4" fill="#ECF2F9" stroke="#D5DDE6" stroke-width="1px"/>
      <text data-slot="date-4" x="0" y="-86" text-anchor="middle" fill="#17202A" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16px" font-weight="700">STEP 04</text>
      <text data-slot="label-4" x="0" y="-56" text-anchor="middle" fill="#17202A" font-size="16px" font-weight="700">運用で改善</text>
      <text data-slot="body-4" x="0" y="70" text-anchor="middle" fill="#65717E" font-size="16px">実記事で検証</text>
    </g>
  </g>

  <text data-slot="source" x="64" y="620" fill="#65717E" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="14px">筆者作成</text>
  <g transform="translate(892 586)"><g data-slot="brand" aria-label="otake-shol visual note">
  <rect width="36" height="36" rx="9" fill="#17202A"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#2C63B4" stroke-width="2"/>
  <g fill="#FFFFFF" aria-hidden="true">
    <rect x="8" y="12" width="4" height="12" rx="1"/>
    <rect x="13" y="12" width="4" height="12" rx="1"/>
    <rect x="18" y="12" width="4" height="12" rx="1"/>
    <rect x="23" y="12" width="4" height="12" rx="1"/>
  </g>
  <text x="48" y="16" fill="#17202A" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16px" font-weight="700">otake-shol</text>
  <text x="48" y="34" fill="#65717E" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="14px">visual note</text>
</g></g>
</svg>
