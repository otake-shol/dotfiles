<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">要点カードのテンプレート</title>
  <desc id="desc">記事で最も残したい主張と次の行動を大きく示す。</desc>
  <rect width="1200" height="675" fill="#FAF8F3"/>
  <rect x="64" y="54" width="168" height="36" rx="4" fill="#DCE8F6"/>
  <text data-slot="eyebrow" x="148" y="79" text-anchor="middle" fill="#17202A" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16px" font-weight="700">KEY TAKEAWAY</text>
  <text data-slot="title" x="64" y="144" fill="#17202A" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="36px" font-weight="700">読者に残したい一文を、独立させる</text>
  <text data-slot="subtitle" x="66" y="183" fill="#65717E" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20px">記事の要約ではなく、判断や行動につながる結論を書く。</text>

  <g transform="translate(104 238)">

    <rect width="992" height="280" rx="4" fill="#123858" stroke="#D5DDE6" stroke-width="2px"/>
    <circle cx="88" cy="92" r="44" fill="#DCE8F6" stroke="#17202A" stroke-width="1px"/>
    <path d="m66 92 15 15 29-33" fill="none" stroke="#17202A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text data-slot="message" x="160" y="96" fill="#FFFFFF" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="36px" font-weight="700">良い図は、描く前のbriefで決まる</text>
    <line x1="160" y1="132" x2="914" y2="132" stroke="#D5DDE6" stroke-width="1px"/>
    <rect x="160" y="166" width="126" height="40" rx="20" fill="#2C63B4"/>
    <text x="223" y="193" text-anchor="middle" fill="#FFFFFF" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16px" font-weight="700">NEXT ACTION</text>
    <text data-slot="action" x="310" y="194" fill="#FFFFFF" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20px" font-weight="700">messageとsourceを先に書く</text>
  </g>

  <text data-slot="source" x="64" y="620" fill="#65717E" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="14px">筆者作成</text>
  <g transform="translate(892 586)"><g data-slot="brand" aria-label="otake-shol visual note">
