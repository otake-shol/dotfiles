<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">変更前後の比較テンプレート</title>
  <desc id="desc">変更前の問題と変更後の改善を左右で対比する。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#1B2438"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFBF5"/>
  <rect x="64" y="54" width="174" height="36" rx="18" fill="#FF6B4A"/>
  <text data-slot="eyebrow" x="151" y="79" text-anchor="middle" fill="#1B2438" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">BEFORE / AFTER</text>
  <text data-slot="title" x="64" y="144" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="36px" font-weight="700">変化を、同じ観点で並べて読む</text>
  <text data-slot="subtitle" x="66" y="183" fill="#55617A" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px">問題の列挙ではなく、何がどう良くなったかを対応させる。</text>

  <g transform="translate(70 242)">
    <rect x="6" y="6" width="430" height="280" rx="18" fill="#1B2438"/>
    <rect width="430" height="280" rx="18" fill="#FFEDE8" stroke="#1B2438" stroke-width="2.5px"/>
    <rect x="28" y="26" width="112" height="36" rx="18" fill="#FF6B4A"/>
    <text x="84" y="51" text-anchor="middle" fill="#1B2438" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">BEFORE</text>
    <text data-slot="label-1" x="30" y="112" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="24px" font-weight="700">情報が散らばる</text>
    <text data-slot="body-1" x="30" y="158" fill="#55617A" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px"><tspan x="30">判断の根拠と制作物が</tspan><tspan x="30" dy="32">別々に管理される</tspan></text>
    <text data-slot="note-1" x="30" y="242" fill="#85023E" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="16px" font-weight="700">毎回ゼロから調整</text>
  </g>

  <line x1="518" y1="382" x2="678" y2="382" stroke="#1B2438" stroke-width="4px" marker-end="url(#arrow)"/>
  <text data-slot="change-label" x="598" y="356" text-anchor="middle" fill="#55617A" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="16px" font-weight="700">仕組み化</text>

  <g transform="translate(700 242)">
    <rect x="6" y="6" width="430" height="280" rx="18" fill="#1B2438"/>
    <rect width="430" height="280" rx="18" fill="#E3F9F1" stroke="#1B2438" stroke-width="2.5px"/>
    <rect x="28" y="26" width="100" height="36" rx="18" fill="#12C48B"/>
    <text x="78" y="51" text-anchor="middle" fill="#1B2438" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">AFTER</text>
    <text data-slot="label-2" x="30" y="112" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="24px" font-weight="700">一つのbriefから生成</text>
    <text data-slot="body-2" x="30" y="158" fill="#55617A" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px"><tspan x="30">判断、図、alt、媒体別画像を</tspan><tspan x="30" dy="32">同じ入力から作る</tspan></text>
    <text data-slot="note-2" x="30" y="242" fill="#0F5F99" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="16px" font-weight="700">再利用できる品質へ</text>
  </g>

  <text data-slot="source" x="64" y="620" fill="#687389" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="14px">筆者作成</text>
  <g transform="translate(892 586)"><g data-slot="brand" aria-label="otake-shol visual note">
  <rect width="36" height="36" rx="9" fill="#1B2438"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#1479BE" stroke-width="2"/>
  <g fill="#FFFFFF" aria-hidden="true">
    <rect x="8" y="12" width="4" height="12" rx="1"/>
    <rect x="13" y="12" width="4" height="12" rx="1"/>
    <rect x="18" y="12" width="4" height="12" rx="1"/>
    <rect x="23" y="12" width="4" height="12" rx="1"/>
  </g>
  <text x="48" y="16" fill="#1B2438" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">otake-shol</text>
  <text x="48" y="34" fill="#687389" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="14px">visual note</text>
</g></g>
</svg>
