    <line x1="600" y1="518" x2="244" y2="518" stroke="#2C63B4" stroke-width="1px" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <text data-slot="message-4" x="422" y="506" text-anchor="middle" fill="#123858" font-size="16px" font-weight="700">検証結果を返す</text>
