<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">アーキテクチャ図のテンプレート</title>
  <desc id="desc">利用者、インターフェース、処理、データの4層を上から下へ示す。</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#1B2438"/></marker></defs>
  <rect width="1200" height="675" fill="#FFFBF5"/>
  <rect x="64" y="54" width="180" height="36" rx="18" fill="#744CF0"/>
  <text data-slot="eyebrow" x="154" y="79" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">ARCHITECTURE</text>
  <text data-slot="title" x="64" y="144" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="36px" font-weight="700">境界と責務を、層で分けて見る</text>
  <text data-slot="subtitle" x="66" y="183" fill="#55617A" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px">矢印は依存またはデータの向きを表す。</text>

  <g transform="translate(130 232)" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif">
    <rect x="6" y="6" width="940" height="66" rx="18" fill="#1B2438"/>
    <rect width="940" height="66" rx="18" fill="#E8F3FA" stroke="#1B2438" stroke-width="2.5px"/>
    <text data-slot="layer-1" x="30" y="42" fill="#1B2438" font-size="20px" font-weight="700">Reader / Author</text>
    <text data-slot="body-1" x="360" y="42" fill="#55617A" font-size="16px">記事を読み、briefへ意図を書く</text>

    <line x1="470" y1="76" x2="470" y2="102" stroke="#1B2438" stroke-width="2.5px" marker-end="url(#arrow)"/>
    <rect x="6" y="116" width="940" height="66" rx="18" fill="#1B2438"/>
    <rect y="110" width="940" height="66" rx="18" fill="#EFEAFF" stroke="#1B2438" stroke-width="2.5px"/>
    <text data-slot="layer-2" x="30" y="152" fill="#1B2438" font-size="20px" font-weight="700">Claude / Codex</text>
    <text data-slot="body-2" x="360" y="152" fill="#55617A" font-size="16px">構成を提案し、JSONだけを編集する</text>

    <line x1="470" y1="186" x2="470" y2="212" stroke="#1B2438" stroke-width="2.5px" marker-end="url(#arrow)"/>
    <rect x="6" y="226" width="940" height="66" rx="18" fill="#1B2438"/>
    <rect y="220" width="940" height="66" rx="18" fill="#FFF3DF" stroke="#1B2438" stroke-width="2.5px"/>
    <text data-slot="layer-3" x="30" y="262" fill="#1B2438" font-size="20px" font-weight="700">OVS CLI</text>
    <text data-slot="body-3" x="360" y="262" fill="#55617A" font-size="16px">検証してSVG・PNG・altを生成する</text>

    <line x1="470" y1="296" x2="470" y2="322" stroke="#1B2438" stroke-width="2.5px" marker-end="url(#arrow)"/>
    <rect x="6" y="336" width="940" height="66" rx="18" fill="#1B2438"/>
    <rect y="330" width="940" height="66" rx="18" fill="#E3F9F1" stroke="#1B2438" stroke-width="2.5px"/>
    <text data-slot="layer-4" x="30" y="372" fill="#1B2438" font-size="20px" font-weight="700">Published assets</text>
    <text data-slot="body-4" x="360" y="372" fill="#55617A" font-size="16px">ブログ・スライド・SNSで再利用する</text>
  </g>

  <text data-slot="source" x="64" y="650" fill="#687389" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="14px">筆者作成</text>
  <g transform="translate(928 616)"><g data-slot="brand" aria-label="otake-shol visual note">
  <rect width="36" height="36" rx="9" fill="#1B2438"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#1479BE" stroke-width="2"/>
  <g fill="#FFFFFF" aria-hidden="true">
    <rect x="8" y="12" width="4" height="12" rx="1"/>
    <rect x="13" y="12" width="4" height="12" rx="1"/>
    <rect x="18" y="12" width="4" height="12" rx="1"/>
    <rect x="23" y="12" width="4" height="12" rx="1"/>
  </g>
  <text x="48" y="16" fill="#1B2438" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">otake-shol</text>
  <text x="48" y="34" fill="#687389" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="14px">visual note</text>
</g></g>
</svg>
