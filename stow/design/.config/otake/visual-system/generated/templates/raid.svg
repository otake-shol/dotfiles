      <rect width="250" height="282" rx="18" fill="#F5E7EC" stroke="#1B2438" stroke-width="2.5px"/>
      <circle cx="34" cy="34" r="12" fill="#85023E"/><text data-slot="label-3" x="58" y="41" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="20px" font-weight="700">Issue</text>
      <text data-slot="body-3" x="24" y="104" fill="#1B2438" font-size="20px" font-weight="700">仕様が一部未確定</text>
      <text x="24" y="150" fill="#55617A" font-size="16px">解消条件と担当を明記</text>
      <rect x="24" y="218" width="202" height="38" rx="12" fill="#FFFFFF" stroke="#1B2438" stroke-width="1.5px"/>
      <text data-slot="owner-3" x="125" y="243" text-anchor="middle" fill="#1B2438" font-size="14px" font-weight="700">Owner: Product</text>
    </g>
    <g transform="translate(822 0)">
      <rect x="6" y="6" width="250" height="282" rx="18" fill="#1B2438"/>
      <rect width="250" height="282" rx="18" fill="#EFEAFF" stroke="#1B2438" stroke-width="2.5px"/>
      <circle cx="34" cy="34" r="12" fill="#744CF0"/><text data-slot="label-4" x="58" y="41" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="20px" font-weight="700">Dependency</text>
      <text data-slot="body-4" x="24" y="104" fill="#1B2438" font-size="20px" font-weight="700">外部APIの公開待ち</text>
      <text x="24" y="150" fill="#55617A" font-size="16px">前後関係と代替案を確認</text>
      <rect x="24" y="218" width="202" height="38" rx="12" fill="#FFFFFF" stroke="#1B2438" stroke-width="1.5px"/>
      <text data-slot="owner-4" x="125" y="243" text-anchor="middle" fill="#1B2438" font-size="14px" font-weight="700">確認: 8/12</text>
