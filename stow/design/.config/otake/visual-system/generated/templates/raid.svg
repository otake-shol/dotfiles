<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RAIDログのテンプレート</title>
  <desc id="desc">リスク、前提、課題、依存関係を4つのカードで整理する。</desc>
  <rect width="1200" height="675" fill="#FFFBF5"/>
  <rect x="64" y="54" width="102" height="36" rx="18" fill="#FF6B4A"/>
  <text data-slot="eyebrow" x="115" y="79" text-anchor="middle" fill="#1B2438" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">RAID</text>
  <text data-slot="title" x="64" y="144" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="36px" font-weight="700">不確実性を、放置せず担当と期限へ変える</text>
  <text data-slot="subtitle" x="66" y="183" fill="#55617A" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px">Risk / Assumption / Issue / Dependencyを同じ粒度で共有する。</text>
  <g transform="translate(64 226)" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif">
    <g>
      <rect x="6" y="6" width="250" height="282" rx="18" fill="#1B2438"/>
      <rect width="250" height="282" rx="18" fill="#FFEDE8" stroke="#1B2438" stroke-width="2.5px"/>
      <circle cx="34" cy="34" r="12" fill="#FF6B4A"/><text data-slot="label-1" x="58" y="41" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="20px" font-weight="700">Risk</text>
      <text data-slot="body-1" x="24" y="104" fill="#1B2438" font-size="20px" font-weight="700">納期の遅延可能性</text>
      <text x="24" y="150" fill="#55617A" font-size="16px">影響と発生確率を確認</text>
      <rect x="24" y="218" width="202" height="38" rx="12" fill="#FFFFFF" stroke="#1B2438" stroke-width="1.5px"/>
      <text data-slot="owner-1" x="125" y="243" text-anchor="middle" fill="#1B2438" font-size="14px" font-weight="700">Owner: PM</text>
    </g>
    <g transform="translate(274 0)">
      <rect x="6" y="6" width="250" height="282" rx="18" fill="#1B2438"/>
      <rect width="250" height="282" rx="18" fill="#FFF3DF" stroke="#1B2438" stroke-width="2.5px"/>
      <circle cx="34" cy="34" r="12" fill="#FFA61E"/><text data-slot="label-2" x="58" y="41" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="20px" font-weight="700">Assumption</text>
      <text data-slot="body-2" x="24" y="104" fill="#1B2438" font-size="20px" font-weight="700">既存基盤を再利用</text>
      <text x="24" y="150" fill="#55617A" font-size="16px">検証日を決めて仮説化</text>
      <rect x="24" y="218" width="202" height="38" rx="12" fill="#FFFFFF" stroke="#1B2438" stroke-width="1.5px"/>
      <text data-slot="owner-2" x="125" y="243" text-anchor="middle" fill="#1B2438" font-size="14px" font-weight="700">確認: 8/05</text>
    </g>
    <g transform="translate(548 0)">
