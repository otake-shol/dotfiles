    </g>

    <line x1="230" y1="326" x2="586" y2="326" stroke="#17202A" stroke-width="1px" marker-end="url(#arrow)"/>
    <text data-slot="message-1" x="408" y="314" text-anchor="middle" fill="#17202A" font-size="16px" font-weight="700">briefを渡す</text>
    <line x1="600" y1="390" x2="956" y2="390" stroke="#17202A" stroke-width="1px" marker-end="url(#arrow)"/>
    <text data-slot="message-2" x="778" y="378" text-anchor="middle" fill="#17202A" font-size="16px" font-weight="700">媒体別画像を生成</text>
    <line x1="970" y1="454" x2="614" y2="454" stroke="#2C63B4" stroke-width="1px" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
