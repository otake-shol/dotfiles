<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">3段階フロー図のテンプレート</title>
  <desc id="desc">入力、判断、結果の3段階を左から右へ示す。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#17202A"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FAF8F3"/>

  <rect x="64" y="54" width="112" height="36" rx="4" fill="#2C63B4"/>
  <text data-slot="eyebrow" x="120" y="79" text-anchor="middle" fill="#FFFFFF" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16px" font-weight="700">FLOW</text>
  <text data-slot="title" x="64" y="144" fill="#17202A" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="36px" font-weight="700">複雑な流れを、3つの意味単位に分ける</text>
  <text data-slot="subtitle" x="66" y="183" fill="#65717E" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20px">矢印には「何が変わるか」が読み取れる順序を与える。</text>

  <line x1="354" y1="364" x2="460" y2="364" stroke="#17202A" stroke-width="1px" marker-end="url(#arrow)"/>
  <line x1="738" y1="364" x2="844" y2="364" stroke="#17202A" stroke-width="1px" marker-end="url(#arrow)"/>

  <g data-slot="node-1">

    <rect x="70" y="268" width="280" height="196" rx="4" fill="#DCE8F6" stroke="#D5DDE6" stroke-width="1px"/>
    <circle cx="116" cy="316" r="22" fill="#2C63B4"/>
    <text x="116" y="323" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Noto Sans JP', sans-serif" font-size="20px" font-weight="700">1</text>
    <text data-slot="label-1" x="154" y="323" fill="#17202A" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="24px" font-weight="700">入力を揃える</text>
    <text data-slot="body-1" x="104" y="376" fill="#65717E" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20px">
      <tspan x="104" dy="0">事実と前提を分け、</tspan>
      <tspan x="104" dy="34">比較可能な形にする</tspan>
    </text>
  </g>

  <g data-slot="node-2">

    <rect x="454" y="268" width="280" height="196" rx="4" fill="#ECF2F9" stroke="#D5DDE6" stroke-width="1px"/>
    <circle cx="500" cy="316" r="22" fill="#DCE8F6"/>
    <text x="500" y="323" text-anchor="middle" fill="#17202A" font-family="'Plus Jakarta Sans', 'Noto Sans JP', sans-serif" font-size="20px" font-weight="700">2</text>
    <text data-slot="label-2" x="538" y="323" fill="#17202A" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="24px" font-weight="700">判断する</text>
    <text data-slot="body-2" x="488" y="376" fill="#65717E" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20px">
      <tspan x="488" dy="0">軸を1つに絞り、</tspan>
      <tspan x="488" dy="34">違いの理由を示す</tspan>
    </text>
  </g>

  <g data-slot="node-3">

    <rect x="838" y="268" width="280" height="196" rx="4" fill="#ECF2F9" stroke="#D5DDE6" stroke-width="1px"/>
    <circle cx="884" cy="316" r="22" fill="#DCE8F6"/>
    <text x="884" y="323" text-anchor="middle" fill="#17202A" font-family="'Plus Jakarta Sans', 'Noto Sans JP', sans-serif" font-size="20px" font-weight="700">3</text>
    <text data-slot="label-3" x="922" y="323" fill="#17202A" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="24px" font-weight="700">行動へ変える</text>
    <text data-slot="body-3" x="872" y="376" fill="#65717E" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20px">
      <tspan x="872" dy="0">次に取る行動を、</tspan>
      <tspan x="872" dy="34">具体的に残す</tspan>
    </text>
  </g>

  <text data-slot="source" x="64" y="620" fill="#65717E" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="14px">筆者作成</text>
  <g transform="translate(892 586)"><g data-slot="brand" aria-label="otake-shol visual note">
  <rect width="36" height="36" rx="9" fill="#17202A"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#2C63B4" stroke-width="2"/>
  <g fill="#FFFFFF" aria-hidden="true">
    <rect x="8" y="12" width="4" height="12" rx="1"/>
    <rect x="13" y="12" width="4" height="12" rx="1"/>
    <rect x="18" y="12" width="4" height="12" rx="1"/>
    <rect x="23" y="12" width="4" height="12" rx="1"/>
  </g>
  <text x="48" y="16" fill="#17202A" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16px" font-weight="700">otake-shol</text>
  <text x="48" y="34" fill="#65717E" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="14px">visual note</text>
</g></g>
</svg>
