<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">シーケンス図のテンプレート</title>
  <desc id="desc">3つの主体間で起きる4つのやり取りを上から下へ示す。</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#17202A"/></marker></defs>
  <rect width="1200" height="675" fill="#FAF8F3"/>
  <rect x="64" y="54" width="150" height="36" rx="4" fill="#123858"/>
  <text data-slot="eyebrow" x="139" y="79" text-anchor="middle" fill="#FFFFFF" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16px" font-weight="700">SEQUENCE</text>
  <text data-slot="title" x="64" y="144" fill="#17202A" font-family="'Zen Maru Gothic', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="36px" font-weight="700">主体間のやり取りを、順番で追う</text>
  <text data-slot="subtitle" x="66" y="183" fill="#65717E" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20px">時間は上から下。矢印には動詞を書く。</text>

  <g font-family="'Noto Sans JP', 'Yu Gothic', sans-serif">
