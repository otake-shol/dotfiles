<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">注意カードのテンプレート</title>
  <desc id="desc">危険、制約、誤用条件と回避策をまとめて示す。</desc>
  <rect width="1200" height="675" fill="#FFFBF5"/>
  <rect x="64" y="54" width="128" height="36" rx="18" fill="#FF6B4A"/>
  <text data-slot="eyebrow" x="128" y="79" text-anchor="middle" fill="#1B2438" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">WARNING</text>
  <text data-slot="title" x="64" y="144" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="36px" font-weight="700">適用できない条件を、先に見せる</text>
  <text data-slot="subtitle" x="66" y="183" fill="#55617A" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px">不安を煽らず、問題と回避策を一対で書く。</text>

  <g transform="translate(104 238)">
    <rect x="8" y="8" width="992" height="280" rx="24" fill="#1B2438"/>
    <rect width="992" height="280" rx="24" fill="#FFEDE8" stroke="#1B2438" stroke-width="4px"/>
    <path d="M92 44 145 142H39Z" fill="#FFA61E" stroke="#1B2438" stroke-width="2.5px"/>
    <path d="M92 78v30M92 124h.1" fill="none" stroke="#1B2438" stroke-width="7" stroke-linecap="round"/>
    <text data-slot="message" x="184" y="90" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="24px" font-weight="700">データなしでチャートを作らない</text>
    <text data-slot="body-1" x="184" y="136" fill="#55617A" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px">装飾用の疑似データは、読者の判断を誤らせる。</text>
    <rect x="184" y="174" width="130" height="38" rx="19" fill="#1B2438"/>
    <text x="249" y="200" text-anchor="middle" fill="#FFFFFF" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="16px" font-weight="700">AVOID</text>
    <text data-slot="action" x="336" y="200" fill="#1B2438" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px" font-weight="700">出典を確認するまで公開を保留する</text>
  </g>

  <text data-slot="source" x="64" y="620" fill="#687389" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="14px">筆者作成</text>
  <g transform="translate(892 586)"><g data-slot="brand" aria-label="otake-shol visual note">
  <rect width="36" height="36" rx="9" fill="#1B2438"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#1479BE" stroke-width="2"/>
  <g fill="#FFFFFF" aria-hidden="true">
    <rect x="8" y="12" width="4" height="12" rx="1"/>
    <rect x="13" y="12" width="4" height="12" rx="1"/>
    <rect x="18" y="12" width="4" height="12" rx="1"/>
    <rect x="23" y="12" width="4" height="12" rx="1"/>
  </g>
  <text x="48" y="16" fill="#1B2438" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">otake-shol</text>
  <text x="48" y="34" fill="#687389" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="14px">visual note</text>
</g></g>
</svg>
