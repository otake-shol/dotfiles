  <rect x="0.00" y="0.00" width="1200.00" height="675.00" fill="#FFFBF5" data-profile-background="slide"/>
  <title id="title">成果物と、繰り返せる仕組みをセットでつくる</title>
  <desc id="desc">学習アプリというプロダクトを作り、ポートフォリオや記事で価値を伝え、dotfilesとOVSと自動検証へ仕組みとして残す3段階の流れ。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#1B2438"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFBF5"/>

  <rect x="64" y="54" width="112" height="36" rx="18" fill="#1479BE"/>
  <text data-slot="eyebrow" x="120" y="79" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">BUILD</text>
  <text data-slot="title" x="64" y="144" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="36px" font-weight="700">成果物と、繰り返せる仕組みをセットでつくる</text>
  <text data-slot="subtitle" x="66" y="183" fill="#55617A" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px">作る・伝える・再利用するまでを、一つの開発活動として設計する。</text>

