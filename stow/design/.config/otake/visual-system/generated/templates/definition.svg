<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">定義カードのテンプレート</title>
  <desc id="desc">用語、その短い定義、含むもの、含まないものを示す。</desc>
  <rect width="1200" height="675" fill="#FFFBF5"/>
  <rect x="64" y="54" width="142" height="36" rx="18" fill="#744CF0"/>
  <text data-slot="eyebrow" x="135" y="79" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Avenir Next', sans-serif" font-size="16px" font-weight="700">DEFINITION</text>
  <text data-slot="title" x="64" y="144" fill="#1B2438" font-family="'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif" font-size="36px" font-weight="700">最初に、言葉の意味をそろえる</text>
  <text data-slot="subtitle" x="66" y="183" fill="#55617A" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="20px">一般的な意味と異なる場合は、この記事での範囲を明記する。</text>

  <g transform="translate(104 232)">
